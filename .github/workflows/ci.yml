name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint and database tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # expo-env.d.ts is generated by `expo start` and gitignored; create it for tsc.
      - name: Generate Expo type references
        run: echo '/// <reference types="expo/types" />' > expo-env.d.ts

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:db
